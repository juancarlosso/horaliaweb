# ================================================================
#  HRNexus Admin — Nginx Performance Config (include in server block)
#  nginx -t to verify, nginx -s reload to apply
# ================================================================

# Enable Brotli (preferred) and Gzip compression
brotli on;
brotli_comp_level 6;
brotli_types text/html text/css application/javascript application/json
             image/svg+xml font/woff2 font/woff text/plain;

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/html text/css application/javascript application/json
           image/svg+xml font/woff2 font/woff text/plain;

# Cache static assets
location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
}

location ~* \.(woff2|woff|ttf|otf|eot)$ {
    add_header Cache-Control "public, max-age=63072000, immutable";
    add_header Access-Control-Allow-Origin "*";
}

location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000";
}

location ~* \.html$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
}

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HTTP/2 push critical assets
http2_push /dist/css/hrnexus-utils.css;
http2_push /dist/css/hrnexus-pages.css;
